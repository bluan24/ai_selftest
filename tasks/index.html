<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>직무별 AI 실행 로드맵</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--navy:#0D47A1;--blue:#1565C0;--ink:#1B2430;--sub:#5B6776;--line:#E1E6EE;--bg:#F4F7FB;--soft:#EAF2FD;
  --p1:#E8F5E9;--p1c:#2E7D32;--p2:#FFF8E1;--p2c:#B26A00;--p3:#FFEBEE;--p3c:#C62828}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:Pretendard,"맑은 고딕","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 80px}
header.top{background:var(--navy);color:#fff;padding:28px 16px 22px}
header.top .inner{max-width:900px;margin:0 auto}
header.top .org{font-size:13px;opacity:.8}
header.top h1{margin:4px 0 6px;font-size:24px;font-weight:800;letter-spacing:-.02em}
header.top p{margin:0;font-size:14px;opacity:.88}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-top:16px}
.lvbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.lvbar b{color:var(--navy)}
.lvsel{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid #CBD4E0;background:#fff;border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.chip small{opacity:.75;font-size:12px;margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.hint{color:var(--sub);font-size:13.5px;margin:6px 0 0}
.warnbox{background:#FFF3E0;border:1px solid #F3D3A6;color:#6D3B00;border-radius:12px;padding:12px 16px;font-size:13.5px;margin-top:16px}
.warnbox summary{cursor:pointer;font-weight:700}
.warnbox ul{margin:8px 0 0;padding-left:20px}.warnbox li{margin:3px 0}
h2.sec{font-size:19px;margin:28px 0 4px;display:flex;align-items:center;gap:8px}
h2.sec::before{content:"";width:5px;height:20px;border-radius:2px;background:var(--blue)}
h2.sec .n{font-size:13px;color:var(--sub);font-weight:600}
.task{background:#fff;border:1px solid var(--line);border-radius:14px;margin-top:12px;overflow:hidden}
.task > summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;gap:12px;align-items:flex-start}
.task > summary::-webkit-details-marker{display:none}
.task > summary .main{flex:1}
.task .tags{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;margin-bottom:4px}
.tg{padding:2px 8px;border-radius:99px;background:#EEF1F5;color:#455A64;font-weight:700}
.tg.d{background:var(--soft);color:var(--navy)}
.tg.p1{background:var(--p1);color:var(--p1c)}.tg.p2{background:var(--p2);color:var(--p2c)}.tg.p3{background:var(--p3);color:var(--p3c)}
.tg.qw{background:#FFF59D;color:#5D4E00}
.task .nm{font-size:17px;font-weight:800;line-height:1.4}
.task .one{font-size:13.5px;color:var(--sub);margin-top:2px}
.task .chev{flex:none;width:28px;height:28px;border-radius:50%;background:#EEF1F5;display:grid;place-items:center;font-weight:800;color:var(--sub);transition:transform .2s}
.task[open] .chev{transform:rotate(180deg)}
.body{padding:0 18px 18px;border-top:1px solid var(--line)}
.flow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.flow > div{border-radius:10px;padding:12px 14px;font-size:13.5px}
.flow .as{background:#F5F5F5}.flow .to{background:var(--soft)}
.flow h4{margin:0 0 6px;font-size:13px}
.flow ol{margin:0;padding-left:20px}.flow li{margin:2px 0}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.steps > div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px}
.steps .h{font-size:12px;font-weight:800;color:#fff;background:var(--blue);display:inline-block;border-radius:99px;padding:1px 10px;margin-bottom:6px}
.steps ol{margin:0;padding-left:18px}.steps li{margin:2px 0}
.prompt{margin-top:12px;background:#0F1B2D;color:#E8EEF7;border-radius:10px;padding:40px 14px 12px;font-size:13.5px;position:relative;white-space:pre-wrap}
.prompt button{position:absolute;top:8px;right:8px;background:#fff;color:var(--navy);border:0;border-radius:8px;padding:5px 10px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.meta{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;margin-top:12px;font-size:13.5px}
.meta dt{color:var(--sub);font-weight:700}.meta dd{margin:0}
.caut{margin-top:10px;font-size:13px;color:#B71C1C;background:#FFF5F5;border-radius:8px;padding:8px 10px}
.qwplan{margin-top:12px;background:#FFFDE7;border:1px solid #F5E79E;border-radius:10px;padding:10px 12px;font-size:13.5px}
.empty{color:var(--sub);font-size:14px;padding:12px 0}
.tools{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
.btn{font:inherit;cursor:pointer;border-radius:10px;border:0;padding:12px 16px;font-weight:700;font-size:14.5px}
.btn-p{background:var(--navy);color:#fff}.btn-s{background:#fff;color:var(--navy);border:1px solid #C5D2E4}
a.back{color:var(--navy);font-weight:700}
.note{font-size:12.5px;color:var(--sub);margin-top:18px;text-align:center}
@media (max-width:640px){
  .flow,.steps{grid-template-columns:1fr}
  .meta{grid-template-columns:1fr} .meta dd{margin-bottom:6px}
  header.top h1{font-size:21px}
}
@media print{
  .noprint,.chips,.lvsel{display:none!important}
  body{background:#fff}.task{break-inside:avoid}
  .task > summary .chev{display:none}
  header.top{background:#fff;color:var(--navy);padding:0 0 10px}
}
</style>
</head>
<body>

  const pc = {Phase1:'p1', Phase2:'p2', Phase3:'p3'}[t.phase] || 'p1';
  const promptText = String(t.prompt || '').replace(/^\[[^\]]+\]\s*/, '');
  const btn = h('button', {type:'button'}, '복사');
  btn.addEventListener('click', e => { e.preventDefault(); copyText(promptText.replace(/^"|"$/g, ''), btn); });
  const d = h('details', {class:'task'},
    h('summary', {},
      h('div', {class:'main'},
        h('div', {class:'tags'}, h('span', {class:'tg d'}, t.dept), h('span', {class:'tg ' + pc}, t.phase), h('span', {class:'tg'}, '난이도 ' + t.diff),
          h('span', {class:'tg'}, '권장 Lv.' + t.lv), q ? h('span', {class:'tg qw'}, '⚡ Quick Win') : null),
        h('div', {class:'nm'}, t.name),
        h('div', {class:'one'}, `${t.tools}  ·  월 ${t.cost}만원 내외  ·  월 ${t.save}분 절감(예시)`)),
      h('span', {class:'chev', 'aria-hidden':'true'}, '▾')),
    h('div', {class:'body'},
      q ? h('div', {class:'qwplan'}, h('b', {}, '⚡ 오늘 첫 액션: '), q.act, h('br'),
        `1주차: ${q.w1}  →  2주차: ${q.w2}  →  3~4주차: ${q.w3}`, h('br'), h('b', {}, '성공 기준: '), q.ok) : null,
      h('div', {class:'flow'},
        h('div', {class:'as'}, h('h4', {}, 'AS-IS 지금 방식'), ol(t.asis)),
        h('div', {class:'to'}, h('h4', {}, 'TO-BE AI 적용 후'), ol(t.tobe))),
      h('div', {class:'steps'},
        h('div', {}, h('span', {class:'h'}, 'Step1 준비 · 1~2주'), ol(t.s1)),
        h('div', {}, h('span', {class:'h'}, 'Step2 파일럿 · 2~4주'), ol(t.s2)),
        h('div', {}, h('span', {class:'h'}, 'Step3 정착 · 1~3개월'), ol(t.s3))),
      promptText ? h('div', {class:'prompt'}, btn, promptText) : null,
      h('dl', {class:'meta'},
        h('dt', {}, 'AI 기술'), h('dd', {}, t.tech),
        h('dt', {}, '추천 도구'), h('dd', {}, t.tools),
        h('dt', {}, '비용·효과'), h('dd', {}, `월 ${t.cost}만원 내외 · 월 ${t.save}분 절감(예시) · 우선순위 ${t.prio}/10`)),
      t.note ? h('div', {class:'caut'}, '⚠️ ' + t.note) : null));
  if (open) d.open = true;
  return d;
}
function section(title, list, sub, openFirst){
  const out = $('#out');
  out.append(h('h2', {class:'sec'}, title, h('span', {class:'n'}, ` ${list.length}개`)));
  if (sub) out.append(h('p', {class:'hint'}, sub));
  if (!list.length) out.append(h('div', {class:'empty'}, '해당 과업이 없습니다.'));
  list.forEach((t, i) => out.append(card(t, openFirst && i === 0)));
}
function renderAll(){
  renderControls();
  const out = $('#out'); out.textContent = '';
  const pool = picked.size ? D.tasks.filter(t => picked.has(t.dept)) : D.tasks;
  const byPrio = (a, b) => (b.prio - a.prio) || (b.save - a.save);
  if (!picked.size){
    out.append(h('p', {class:'hint', style:'margin-top:18px'}, '부서를 고르면 해당 부서 과업만 볼 수 있습니다. 지금은 전 부서 Quick Win을 보여 드립니다.'));
    section('⚡ 이번 주 바로 시작할 Quick Win', D.qw.map(q => D.tasks.find(t => t.no === q.no)), '비용이 낮고(월 10만원 이하) 난이도가 쉬운 과업입니다.', true);
    return;
  }
  if (!level){
    const qw = pool.filter(t => QW.has(t.no)).sort(byPrio);
    const rest = pool.filter(t => !QW.has(t.no)).sort((a, b) => (a.lv - b.lv) || byPrio(a, b));
    section('⚡ Quick Win', qw, '비용이 낮고 쉬워 이번 주에 시작할 수 있는 과업입니다.', true);
    section('단계별 과업', rest, '권장 진입 등급이 낮은 과업부터 정렬했습니다. 준비도 진단을 받으면 우리 회사에 맞게 나눠 보여 드립니다.');
    return;
  }
  const now = pool.filter(t => t.lv === level).sort(byPrio);
  const before = pool.filter(t => t.lv < level).sort((a, b) => (QW.has(b.no) - QW.has(a.no)) || (b.lv - a.lv) || byPrio(a, b));
  const next = pool.filter(t => t.lv > level).sort((a, b) => (a.lv - b.lv) || byPrio(a, b));
  section(`지금 단계(${LVN[level]})에서 추진할 과업`, now, '우리 회사 등급에 맞는 과업입니다. 우선순위 높은 순입니다.', true);
  section('기반 다지기 — 이전 단계 과업', before, '아직 하지 않았다면 먼저 실행하세요. ⚡ Quick Win은 비용이 낮아 바로 시작하기 좋습니다.');
  section('다음 단계 과업', next, '등급이 올라가면 추진할 과업입니다. 미리 준비 조건을 살펴보세요.');
}
function openAll(v){ document.querySelectorAll('details.task').forEach(d => d.open = v); }
D.caut.forEach(c => $('#cautList').append(h('li', {}, h('b', {}, c.t + ': '), c.d)));
renderAll();
</script>
</body>
</html>
