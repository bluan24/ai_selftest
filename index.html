<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 역량수준 자기진단</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --navy:#0D47A1; --blue:#1565C0; --ink:#1B2430; --sub:#5B6776; --line:#E1E6EE;
  --bg:#F4F7FB; --card:#FFFFFF; --soft:#EAF2FD;
  --l1:#E53935; --l1bg:#FDECEC; --l2:#EF8A00; --l2bg:#FFF3E0;
  --l3:#2E7D32; --l3bg:#E8F5E9; --l4:#1565C0; --l4bg:#E3F0FD;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Pretendard,"맑은 고딕","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--ink);
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 96px}
header.top{background:var(--navy);color:#fff;padding:28px 16px 22px}
header.top .inner{max-width:760px;margin:0 auto}
header.top .org{font-size:13px;opacity:.8;letter-spacing:.02em}
header.top h1{margin:4px 0 6px;font-size:24px;font-weight:800;letter-spacing:-.02em}
header.top p{margin:0;font-size:14px;opacity:.88}
.progress{position:sticky;top:0;z-index:10;background:rgba(244,247,251,.94);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);padding:10px 16px}
.progress .inner{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar{flex:1;height:8px;background:#DCE3EC;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--blue);border-radius:99px;transition:width .3s}
.progress span{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:16px}
.step-title{display:flex;align-items:baseline;gap:10px;margin:24px 0 4px}
.step-title b{font-size:13px;color:var(--blue);font-weight:700}
.step-title h2{margin:0;font-size:20px;letter-spacing:-.01em}
.hint{color:var(--sub);font-size:13.5px;margin:4px 0 0}
label.f{display:block;font-size:13.5px;font-weight:600;margin:14px 0 6px}
label.f em{color:var(--l1);font-style:normal}
input[type=text],input[type=email],input[type=tel]{width:100%;font:inherit;padding:12px 14px;border:1px solid #CBD4E0;border-radius:10px;background:#fff}
input[type=text]:focus,input[type=email]:focus,input[type=tel]:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:transparent}
.scale{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px;font-size:12.5px;text-align:center}
.scale div{padding:8px 4px;border-radius:8px;background:var(--soft);color:var(--navy);font-weight:600}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px;transition:border-color .2s}
.q.missing{border-color:var(--l1);box-shadow:0 0 0 3px var(--l1bg)}
.q .qn{font-size:12.5px;font-weight:700;color:var(--blue)}
.q .qt{font-size:16px;font-weight:700;margin:2px 0 12px;line-height:1.5}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.opt{position:relative;display:flex;flex-direction:column;gap:4px;border:1.5px solid #D6DDE7;border-radius:10px;
  padding:10px 10px 12px;cursor:pointer;background:#fff;min-height:88px;transition:all .15s}
.opt:hover{border-color:#9DB5D6}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .pt{font-size:12px;font-weight:800;color:var(--sub)}
.opt .tx{font-size:13px;line-height:1.45;color:var(--ink)}
.opt:has(input:checked){border-color:var(--blue);background:var(--soft);box-shadow:inset 0 0 0 1px var(--blue)}
.opt:has(input:checked) .pt{color:var(--blue)}
.opt:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:2px}
.nav{display:flex;gap:10px;margin-top:22px}
button{font:inherit;cursor:pointer;border-radius:10px;border:0;padding:14px 18px;font-weight:700;font-size:15px}
.btn-p{background:var(--navy);color:#fff;flex:1}
.btn-p:disabled{background:#93A6C3;cursor:default}
.btn-s{background:#fff;color:var(--navy);border:1px solid #C5D2E4}
.opt-l{color:var(--sub);font-weight:400;font-size:12.5px}
label.cb{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px;cursor:pointer}
label.cb input{width:18px;height:18px;margin-top:3px;accent-color:var(--blue);flex:none}
.consent .ct{font-weight:700;font-size:15px;margin-bottom:8px}
.consent table{width:100%;border-collapse:collapse;font-size:13px}
.consent th{width:76px;text-align:left;color:var(--sub);font-weight:600;padding:6px 8px 6px 0;vertical-align:top}
.consent td{padding:6px 0;border-bottom:1px solid var(--line)}
.mailnote{margin-top:12px;font-size:13.5px;padding:10px 12px;border-radius:8px;background:var(--l3bg);color:#1B5E20}
.mailnote.warn{background:var(--l2bg);color:#8A4B00}
.err{color:var(--l1);font-size:13.5px;margin-top:10px;min-height:1px}
.hidden{display:none!important}
/* 결과 */
.res-head{text-align:center;padding:26px 20px}
.res-head .who{color:var(--sub);font-size:14px}
.score{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.score small{font-size:20px;color:var(--sub);font-weight:600}
.badge{display:inline-block;margin-top:10px;padding:6px 16px;border-radius:99px;font-weight:800;font-size:17px}
.desc{margin:14px auto 0;max-width:560px;font-size:15px}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:18px}
.ladder div{padding:8px 2px;border-radius:8px;font-size:12px;text-align:center;background:#EEF1F5;color:#8A95A3;font-weight:600}
.ladder div b{display:block;font-size:13px}
.ladder div.on{color:#fff}
h3.sec{font-size:17px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
h3.sec::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--blue)}
.radar{display:flex;justify-content:center}
.radar svg{width:100%;max-width:380px;height:auto}
table.areas{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
table.areas th{font-size:12.5px;color:var(--sub);font-weight:600;text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
table.areas td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.areas td.n{white-space:nowrap;font-weight:700}
table.areas td.s{white-space:nowrap;font-variant-numeric:tabular-nums}
.lv{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;border-radius:6px}
.tip{font-size:13.5px;color:#36414F}
ul.g{margin:0;padding-left:20px}
ul.g li{margin:4px 0}
ul.chk{list-style:none;margin:0;padding:0}
ul.chk li{margin:6px 0}
ul.chk label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
ul.chk input{width:18px;height:18px;margin-top:3px;accent-color:var(--blue);flex:none}
.train{background:var(--soft);border-radius:10px;padding:14px 16px}
.train b{color:var(--navy)}
.note{font-size:12.5px;color:var(--sub);margin-top:18px;text-align:center}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;
  border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:560px){
  .opts{grid-template-columns:1fr 1fr}
  .opt{min-height:76px}
  header.top h1{font-size:21px}
  .score{font-size:44px}
}
@media print{
  .progress,.nav,.no-print{display:none!important}
  body{background:#fff}
  .card{break-inside:avoid;border-color:#ccc}
  header.top{background:#fff;color:var(--navy);padding:0 0 10px}
}
</style>
</head>
<body>
<header class="top"><div class="inner">
  <div class="org">대한상공회의소 경기인력개발원 · 중소기업 AI 훈련확산센터</div>
  <h1>AI 역량수준 자기진단</h1>
  <p>25문항 · 약 5~7분 소요 · 제출 즉시 결과와 맞춤 성장 가이드를 확인할 수 있습니다.</p>
</div></header>

<div class="progress" id="progress"><div class="inner">
  <div class="bar"><i id="barFill"></i></div><span id="progText">응답 0 / 25</span>
</div></div>

<main class="wrap">
  <section id="survey"></section>
  <section id="result" class="hidden"></section>
</main>

<script>
/* 진단용: 본 스크립트가 문법 오류 등으로 실행되지 않으면 화면에 안내를 표시 */
window.__errs = [];
window.addEventListener('error', function(e){ window.__errs.push(e.message); });
setTimeout(function(){
  var s = document.getElementById('survey');
  if (s && !s.firstChild) {
    s.innerHTML = '<div class="card" style="border-color:#E53935;color:#B71C1C">화면 스크립트가 실행되지 않았습니다. ' +
      (window.__errs.length ? '오류: ' + window.__errs.join(' / ') + ' — ' : '') +
      'Index 파일 전체(맨 끝 &lt;/html&gt;까지)를 다시 붙여넣은 뒤 새 버전으로 배포해 주세요.</div>';
  }
}, 2500);
</script>

  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const k of kids.flat()){ if (k == null) continue; e.append(k instanceof Node ? k : document.createTextNode(k)); }
  return e;
}

      h('table',{},h('tbody',{},
        h('tr',{},h('th',{},'수집 항목'),h('td',{},'기업명, 부서/직책, 성명, 이메일, 휴대폰 번호(선택), 진단 응답')),
        h('tr',{},h('th',{},'이용 목적'),h('td',{},'AI 역량 진단 결과 제공, 맞춤 교육과정 안내 및 훈련 운영')),
        h('tr',{},h('th',{},'보유 기간'),h('td',{},CONSENT_RETENTION)))),
      h('p',{class:'hint'},'동의를 거부할 수 있으나, 거부 시 진단에 참여할 수 없습니다.'),
      h('label',{class:'cb'}, h('input',{type:'checkbox',id:'consent'}), h('span',{},'위 내용을 확인하였으며 개인정보 수집·이용에 동의합니다.'))
    )
  );
  for (const k of ['company','dept','name','email','phone']){
    const el = $('#'+k, root); el.value = info[k];
    el.addEventListener('input', () => info[k] = el.value);
  }
  for (const k of ['consent','emailMe']){
    const el = $('#'+k, root); el.checked = info[k];
    el.addEventListener('change', () => info[k] = el.checked);
  }
}
const isEmail = s => /^[^@ ]+@[^@ ]+[.][^@ ]+$/.test(s.trim());
const phoneDigits = s => s.replace(/[^0-9]/g,'');

function renderArea(root, a){
  root.append(
    h('div',{class:'step-title'}, h('b',{},`STEP ${a+2} / 6`), h('h2',{},DATA.areas[a])),
    h('p',{class:'hint'},'문항마다 가장 가까운 설명 하나를 선택하세요.')
  );
  DATA.questions.filter(q => q.area === a).forEach(q => {
    const box = h('div',{class:'q',id:'q'+q.no},
      h('div',{class:'qn'},`Q${q.no}`),
      h('div',{class:'qt'},q.q)
    );
    const opts = h('div',{class:'opts',role:'radiogroup','aria-label':`Q${q.no}`});
    q.opts.forEach((t,i) => {
      const inp = h('input',{type:'radio',name:'q'+q.no,value:String(i+1)});
      if (answers[q.no-1] === i+1) inp.checked = true;
      inp.addEventListener('change', () => { answers[q.no-1] = i+1; box.classList.remove('missing'); updateProgress(); });
      opts.append(h('label',{class:'opt'}, inp, h('span',{class:'pt'},`${i+1}점`), h('span',{class:'tx'},t)));
    });
    box.append(opts); root.append(box);
  });
}

function renderStep(){
  const root = $('#survey'); root.textContent = '';
  if (step === 0) renderInfo(root); else renderArea(root, step-1);
  const err = h('div',{class:'err',id:'err',role:'alert'});
  const nav = h('div',{class:'nav'});
  if (step > 0) nav.append(h('button',{class:'btn-s',type:'button',onclick:()=>{step--;renderStep();scrollTo(0,0);}},'이전'));
  const last = step === 5;
  nav.append(h('button',{class:'btn-p',type:'button',id:'nextBtn',onclick:last?submit:next}, last?'제출하고 결과 보기':'다음'));
  root.append(err, nav);
}

function next(){
  const err = $('#err'); err.textContent = '';
  if (step === 0){
    if (!info.company.trim() || !info.name.trim()){ err.textContent = '기업명과 성명을 입력해 주세요.'; return; }
    if (!isEmail(info.email)){ err.textContent = '이메일 주소를 정확히 입력해 주세요.'; $('#email').focus(); return; }
    const pd = phoneDigits(info.phone);
    if (pd && (pd.length < 9 || pd.length > 11)){ err.textContent = '휴대폰 번호를 확인해 주세요. (선택 항목이므로 비워 두셔도 됩니다)'; $('#phone').focus(); return; }
    if (!info.consent){ err.textContent = '개인정보 수집·이용에 동의해 주세요.'; return; }
  } else if (!checkArea(step-1)) return;
  step++; renderStep(); scrollTo(0,0);
}

function checkArea(a){
  const miss = DATA.questions.filter(q => q.area === a && !answers[q.no-1]);
  miss.forEach(q => $('#q'+q.no).classList.add('missing'));
  if (miss.length){
    $('#err').textContent = `응답하지 않은 문항이 있습니다: ${miss.map(q=>'Q'+q.no).join(', ')}`;
    $('#q'+miss[0].no).scrollIntoView({behavior:'smooth',block:'center'});
    return false;
  }
  return true;
}

/* 서버 판정과 동일한 계산 (미리보기·표시용) */
function compute(scores){
  const areaScores = DATA.areas.map((_,a) => scores.slice(a*5,a*5+5).reduce((s,v)=>s+v,0));
  const total = areaScores.reduce((s,v)=>s+v,0);
  const level = total>=82?4:total>=63?3:total>=44?2:1;
  const areaLevels = areaScores.map(s => s>=17?4:s>=13?3:s>=9?2:1);
  return {total, level, areaScores, areaLevels};
}

function submit(){
  if (!checkArea(4)) return;
  if (answers.some(v=>!v)){ $('#err').textContent = '응답하지 않은 문항이 있습니다. 이전 단계를 확인해 주세요.'; return; }
  const btn = $('#nextBtn'); btn.disabled = true;
  btn.textContent = ''; btn.append(h('span',{class:'spinner'}),'저장 중…');
  const payload = {company:info.company, dept:info.dept, name:info.name, email:info.email.trim(), phone:info.phone, consent:info.consent, emailMe:info.emailMe, scores:answers.slice()};
  const fail = e => {
    btn.disabled = false; btn.textContent = '제출하고 결과 보기';
    $('#err').textContent = '저장 중 문제가 발생했습니다. 잠시 후 다시 눌러 주세요. (' + ((e && e.message) || e) + ')';
  };
  if (window.google && google.script && google.script.run){
    google.script.run.withSuccessHandler(showResult).withFailureHandler(fail).submitResponse(payload);
  } else if (DEPLOY_ID){
    /* 외부 호스팅: Apps Script 웹앱(doPost)으로 전송. 헤더를 지정하지 않아야 브라우저 사전요청 없이 전송됩니다. */
    fetch(API_URL, {method:'POST', body: JSON.stringify(payload), redirect:'follow'})
      .then(res => res.json())
      .then(j => j && j.ok ? showResult(j.result) : fail(new Error((j && j.error) || '서버 응답 오류')))
      .catch(fail);
  } else {
    /* Apps Script 밖에서 열었을 때(미리보기): 저장 없이 결과만 표시 */
    setTimeout(() => showResult(compute(payload.scores)), 400);
  }
}

function radarSVG(scores){
  const N=5, cx=190, cy=170, R=120, ns=['http:','','www.w3.org','2000','svg'].join('/');
  const svg = document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox','0 0 380 340'); svg.setAttribute('role','img');
  svg.setAttribute('aria-label','영역별 점수 레이더 차트: '+DATA.areas.map((a,i)=>`${a} ${scores[i]}점`).join(', '));
  const pt = (i,r) => { const ang = -Math.PI/2 + i*2*Math.PI/N; return [cx + r*Math.cos(ang), cy + r*Math.sin(ang)]; };
  const mk = (tag, at) => { const e=document.createElementNS(ns,tag); for (const k in at) e.setAttribute(k,at[k]); svg.append(e); return e; };
  [5,10,15,20].forEach(v => mk('polygon',{points:[...Array(N)].map((_,i)=>pt(i,R*v/20).join(',')).join(' '),
    fill: v===20?'#F7F9FC':'none', stroke:'#D5DCE6','stroke-width':1}));
  for (let i=0;i<N;i++){ const [x,y]=pt(i,R); mk('line',{x1:cx,y1:cy,x2:x,y2:y,stroke:'#D5DCE6'}); }
  mk('polygon',{points:scores.map((s,i)=>pt(i,R*s/20).join(',')).join(' '),fill:'rgba(21,101,192,.22)',stroke:'#1565C0','stroke-width':2.5,'stroke-linejoin':'round'});
  scores.forEach((s,i)=>{
    const [x,y]=pt(i,R*s/20); mk('circle',{cx:x,cy:y,r:4,fill:'#1565C0'});
    const [lx,ly]=pt(i,R+30);
    const t1 = mk('text',{x:lx,y:ly-2,'text-anchor':'middle','font-size':13,'font-weight':700,fill:'#1B2430'}); t1.textContent = DATA.areas[i];
    const t2 = mk('text',{x:lx,y:ly+15,'text-anchor':'middle','font-size':12.5,fill:'#1565C0','font-weight':700}); t2.textContent = s+'점';
  });
  return svg;
}

function lvTag(l){ return h('span',{class:'lv',style:`color:${LV[l-1].c};background:${LV[l-1].bg}`}, `Lv.${l}`); }

function showResult(r){
  window.onbeforeunload = null;
  $('#survey').classList.add('hidden'); $('#progress').classList.add('hidden');
  const root = $('#result'); root.textContent=''; root.classList.remove('hidden');
  const li = r.level - 1, G = DATA.guide;

  const ladder = h('div',{class:'ladder'}, LV.map((v,i) => {
    const d = h('div',{class: i===li?'on':''}, h('b',{},v.name), `${v.range}점`);
    if (i===li) d.style.background = v.c; return d;
  }));
  root.append(h('div',{class:'card res-head'},
    h('div',{class:'who'}, `${info.company}${info.dept?' · '+info.dept:''} · ${info.name} 님의 진단 결과`),
    h('div',{class:'score'}, String(r.total), h('small',{},' / 100점')),
    h('div',{class:'badge',style:`color:${LV[li].c};background:${LV[li].bg}`}, '★ '+LV[li].name),
    h('p',{class:'desc'}, G['현재 모습'][li]),
    ladder,
    r.mail === 'sent' ? h('div',{class:'mailnote'}, `결과와 성장 가이드를 ${info.email.trim()} 으로 보내드렸습니다.`) :
    r.mail === 'dup' ? h('div',{class:'mailnote'}, '10분 이내에 같은 주소로 결과 메일을 이미 보내드렸습니다.') :
    r.mail === 'failed' ? h('div',{class:'mailnote warn'}, '결과 메일 발송이 지연되고 있습니다. 이 화면을 인쇄하거나 PDF로 저장해 두세요.') : null
  ));

  const tbody = h('tbody');
  DATA.areas.forEach((a,i) => tbody.append(h('tr',{},
    h('td',{class:'n'},a),
    h('td',{class:'s'},`${r.areaScores[i]} / 20`),
    h('td',{},lvTag(r.areaLevels[i])),
    h('td',{class:'tip'}, DATA.areaGuide[i][r.areaLevels[i]-1])
  )));
  const strongest = r.areaScores.indexOf(Math.max(...r.areaScores));
  const weakest = r.areaScores.indexOf(Math.min(...r.areaScores));
  root.append(h('div',{class:'card'},
    h('h3',{class:'sec'},'영역별 역량 프로필'),
    h('div',{class:'radar'}, radarSVG(r.areaScores)),
    h('p',{class:'hint',style:'text-align:center'}, strongest===weakest ? '다섯 영역이 고르게 분포되어 있습니다.' :
      `가장 강한 영역은 ‘${DATA.areas[strongest]}’, 우선 보완할 영역은 ‘${DATA.areas[weakest]}’입니다.`),
    h('table',{class:'areas'},
      h('thead',{},h('tr',{},h('th',{},'영역'),h('th',{},'점수'),h('th',{},'수준'),h('th',{},'추천 보완 활동'))),
      tbody)
  ));

  const list = key => h('ul',{class:'g'}, lines(G[key][li]).map(t=>h('li',{},t)));
  root.append(
    h('div',{class:'card'}, h('h3',{class:'sec'},'다음에 해볼 작업'), list('다음에 해볼 작업')),
    h('div',{class:'card'}, h('h3',{class:'sec'},'추천 도구'), list('추천 도구'),
      h('p',{class:'hint'},'※ 도구명은 예시입니다. 사용 전 회사의 정보보안 정책을 확인하세요.')),
    h('div',{class:'card'}, h('h3',{class:'sec'},'업무 접목 방법'), list('업무 접목 방법')),
    h('div',{class:'card'}, h('h3',{class:'sec'}, r.level<4?'다음 레벨로 가기 위한 체크포인트':'지속 성장 체크포인트'),
      h('ul',{class:'chk'}, lines(G['다음 레벨 체크포인트'][li]).map((t,i)=>h('li',{},
        h('label',{}, h('input',{type:'checkbox'}), h('span',{},t)))))),
    h('div',{class:'card'}, h('h3',{class:'sec'},'권장 훈련'),
      (()=>{ const [t,...rest] = lines(G['권장 훈련'][li]); return h('div',{class:'train'}, h('b',{},t), h('div',{},rest.join(' '))); })()),
    h('div',{class:'nav no-print'}, h('button',{class:'btn-p',type:'button',onclick:()=>window.print()},'결과 인쇄 / PDF로 저장')),
    h('p',{class:'note'},'응답이 정상적으로 제출되었습니다. 본 자기진단 결과는 참고용이며, 정확한 수준 판정은 실무역량테스트와 함께 활용하시기 바랍니다.')
  );
  scrollTo(0,0);
}

function showFatal(msg){
  const box = document.getElementById('survey');
  if (!box) return;
  box.innerHTML = '';
  const d = document.createElement('div');
  d.className = 'card';
  d.style.cssText = 'border-color:#E53935;color:#B71C1C';
  d.textContent = '화면을 불러오는 중 오류가 발생했습니다: ' + msg +
    '  — Index 파일 내용이 끝까지(마지막 </html> 줄까지) 붙여넣어졌는지 확인해 주세요.';
  box.append(d);
}
window.addEventListener('error', e => showFatal(e.message || '알 수 없는 오류'));
function init(){
  try {
    if (typeof DATA === 'undefined' || !DATA.questions || DATA.questions.length !== 25) throw new Error('문항 데이터 누락');
    window.onbeforeunload = () => answers.some(Boolean) ? true : undefined;
    renderStep(); updateProgress();
  } catch (e) { showFatal(e.message); }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
</script>

</html>
