<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>중소기업 AI 준비도 진단</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --navy:#0D47A1; --blue:#1565C0; --ink:#1B2430; --sub:#5B6776; --line:#E1E6EE;
  --bg:#F4F7FB; --card:#FFFFFF; --soft:#EAF2FD;
  --l1:#E53935; --l1bg:#FDECEC; --l2:#EF6C00; --l2bg:#FFF3E0; --l3:#B8860B; --l3bg:#FFF8D6;
  --l4:#2E7D32; --l4bg:#E8F5E9; --l5:#1565C0; --l5bg:#E3F0FD;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Pretendard,"맑은 고딕","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--ink);
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 96px}
header.top{background:var(--navy);color:#fff;padding:28px 16px 22px}
header.top .inner{max-width:820px;margin:0 auto}
header.top .org{font-size:13px;opacity:.8}
header.top h1{margin:4px 0 6px;font-size:24px;font-weight:800;letter-spacing:-.02em}
header.top p{margin:0;font-size:14px;opacity:.88}
.progress{position:sticky;top:0;z-index:10;background:rgba(244,247,251,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 16px}
.progress .inner{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar{flex:1;height:8px;background:#DCE3EC;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--blue);border-radius:99px;transition:width .3s}
.progress span{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:16px}
.step-title{display:flex;align-items:baseline;gap:10px;margin:24px 0 4px;flex-wrap:wrap}
.step-title b{font-size:13px;color:var(--blue);font-weight:700}
.step-title h2{margin:0;font-size:20px;letter-spacing:-.01em}
.hint{color:var(--sub);font-size:13.5px;margin:4px 0 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
label.f{display:block;font-size:13.5px;font-weight:600;margin:14px 0 6px}
label.f em{color:var(--l1);font-style:normal}
.opt-l{color:var(--sub);font-weight:400;font-size:12.5px}
input[type=text],input[type=email],input[type=tel],select{width:100%;font:inherit;padding:12px 14px;border:1px solid #CBD4E0;border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:transparent}
label.cb{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px;cursor:pointer}
label.cb input{width:18px;height:18px;margin-top:3px;accent-color:var(--blue);flex:none}
.consent .ct{font-weight:700;font-size:15px;margin-bottom:8px}
.consent table{width:100%;border-collapse:collapse;font-size:13px}
.consent th{width:76px;text-align:left;color:var(--sub);font-weight:600;padding:6px 8px 6px 0;vertical-align:top}
.consent td{padding:6px 0;border-bottom:1px solid var(--line)}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px;transition:border-color .2s}
.q.missing{border-color:var(--l1);box-shadow:0 0 0 3px var(--l1bg)}
.q .qn{font-size:12.5px;font-weight:700;color:var(--blue)}
.q .qt{font-size:16px;font-weight:700;margin:2px 0 12px;line-height:1.5}
.opts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.opt{position:relative;display:flex;flex-direction:column;gap:4px;border:1.5px solid #D6DDE7;border-radius:10px;padding:10px 10px 12px;cursor:pointer;background:#fff;min-height:86px;transition:all .15s}
.opt:hover{border-color:#9DB5D6}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .pt{font-size:12px;font-weight:800;color:var(--sub)}
.opt .tx{font-size:12.5px;line-height:1.45}
.opt:has(input:checked){border-color:var(--blue);background:var(--soft);box-shadow:inset 0 0 0 1px var(--blue)}
.opt:has(input:checked) .pt{color:var(--blue)}
.opt:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:2px}
.yn{display:flex;gap:8px;flex-wrap:wrap}
.yn .opt{min-height:0;flex-direction:row;padding:9px 14px}
.qw{border:1px solid #F5E79E;background:#FFFDE7;border-radius:12px;padding:12px 14px;margin-top:10px}
.qw .nm{font-weight:800;font-size:15.5px}
.qw .ds{font-size:13.5px;color:#36414F;margin-top:2px}
.golink{display:block;text-align:center;text-decoration:none;margin-top:14px;background:var(--navy);color:#fff;border-radius:10px;padding:13px 16px;font-weight:800}
.nav{display:flex;gap:10px;margin-top:22px}
button{font:inherit;cursor:pointer;border-radius:10px;border:0;padding:14px 18px;font-weight:700;font-size:15px}
.btn-p{background:var(--navy);color:#fff;flex:1}
.btn-p:disabled{background:#93A6C3;cursor:default}
.btn-s{background:#fff;color:var(--navy);border:1px solid #C5D2E4}
.err{color:var(--l1);font-size:13.5px;margin-top:10px}
.hidden{display:none!important}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
/* 결과 */
.res-head{text-align:center;padding:26px 20px}
.res-head .who{color:var(--sub);font-size:14px}
.score{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.score small{font-size:20px;color:var(--sub);font-weight:600}
.badge{display:inline-block;margin-top:10px;padding:6px 16px;border-radius:99px;font-weight:800;font-size:17px}
.desc{margin:14px auto 0;max-width:600px}
.ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:18px}
.ladder div{padding:8px 2px;border-radius:8px;font-size:11.5px;text-align:center;background:#EEF1F5;color:#8A95A3;font-weight:600;line-height:1.35}
.ladder div b{display:block;font-size:12.5px}
.ladder div.on{color:#fff}
h3.sec{font-size:17px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
h3.sec::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--blue);flex:none}
.radar{display:flex;justify-content:center}
.radar svg{width:100%;max-width:520px;height:auto}
table.areas{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
table.areas th{font-size:12.5px;color:var(--sub);font-weight:600;text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
table.areas td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.areas td.n{white-space:nowrap;font-weight:700}
table.areas td.s{white-space:nowrap;font-variant-numeric:tabular-nums}
.lv{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;border-radius:6px;white-space:nowrap}
.tip{font-size:13.5px;color:#36414F}
ul.g{margin:0;padding-left:20px} ul.g li{margin:4px 0}
.goal{font-size:16px;font-weight:800;color:var(--navy);margin-bottom:12px}
.timeline{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.phase{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#FAFCFF}
.phase .ph{font-size:12.5px;font-weight:800;color:#fff;background:var(--blue);display:inline-block;padding:2px 10px;border-radius:99px;margin-bottom:6px}
.phase ul{margin:0;padding-left:18px;font-size:13.5px} .phase li{margin:3px 0}
dl.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;margin:14px 0 0;font-size:14px}
dl.kv dt{color:var(--sub);font-weight:700} dl.kv dd{margin:0}
.task{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:10px}
.task .top{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px}
.chip{padding:2px 8px;border-radius:99px;background:#EEF1F5;color:#455A64;font-weight:700}
.chip.job{background:var(--soft);color:var(--navy)}
.task .nm{font-size:16px;font-weight:800;margin:6px 0 2px}
.task .ds{font-size:13.5px;color:#36414F}
.task .meta{font-size:13px;margin-top:6px;color:#36414F}
.task .meta b{color:var(--sub);font-weight:700}
.task .warn{font-size:12.5px;color:#B71C1C;margin-top:6px}
.task.pre{background:#FFFBF2;border-color:#F3DDB3}
.note{font-size:12.5px;color:var(--sub);margin-top:18px;text-align:center}
.mailnote{margin-top:12px;font-size:13.5px;padding:10px 12px;border-radius:8px;background:var(--l4bg);color:#1B5E20}
.mailnote.warn{background:var(--l2bg);color:#8A4B00}
.train{background:var(--soft);border-radius:10px;padding:12px 14px;margin-top:10px;font-size:14px}
@media (max-width:640px){
  .opts{grid-template-columns:1fr}
  .opt{min-height:0;flex-direction:row;align-items:baseline;gap:10px}
  .grid2{grid-template-columns:1fr}
  .timeline{grid-template-columns:1fr}
  dl.kv{grid-template-columns:1fr;gap:2px} dl.kv dd{margin-bottom:8px}
  .ladder div{font-size:10.5px} .ladder div b{font-size:11px}
  header.top h1{font-size:21px} .score{font-size:44px}
  table.areas thead{display:none}
  table.areas tr{display:grid;grid-template-columns:1fr auto auto;gap:0 10px;border-bottom:1px solid var(--line);padding:8px 0}
  table.areas td{border:0;padding:2px 0}
  table.areas td.tip{grid-column:1/-1;font-size:13px}
}
@media print{
  .progress,.nav,.no-print{display:none!important}
  body{background:#fff} .card{break-inside:avoid;border-color:#ccc}
  header.top{background:#fff;color:var(--navy);padding:0 0 10px}
}
</style>
</head>
<body>
<header class="top"><div class="inner">
  <div class="org">대한상공회의소 경기인력개발원 · 중소기업 AI 훈련확산센터</div>
  <h1>중소기업 AI 준비도 진단</h1>
  <p>30문항 · 약 7~10분 소요 · 제출 즉시 등급, 12개월 로드맵, 추천 AI 활용 과제를 확인할 수 있습니다.</p>
</div></header>
<div class="progress" id="progress"><div class="inner">
  <div class="bar"><i id="barFill"></i></div><span id="progText">응답 0 / 30</span>
</div></div>
<main class="wrap">
  <section id="survey"></section>
  <section id="result" class="hidden"></section>
</main>
<script>

function renderStep(){
  const root = $('#survey'); root.textContent = '';
  if (step === 0) renderInfo(root); else renderArea(root, step-1);
  const nav = h('div',{class:'nav'});
  if (step > 0) nav.append(h('button',{class:'btn-s',type:'button',onclick:()=>{step--;renderStep();scrollTo(0,0);}},'이전'));
  const last = step === STEPS - 1;
  nav.append(h('button',{class:'btn-p',type:'button',id:'nextBtn',onclick:last?submit:next}, last?'제출하고 결과 보기':'다음'));
  root.append(h('div',{class:'err',id:'err',role:'alert'}), nav);
}
const isEmail = s => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s.trim());
function next(){
  const err = $('#err'); err.textContent = '';
  if (step === 0){
    const miss = [];
    if (!info.company.trim()) miss.push('기업명'); if (!info.industry) miss.push('업종'); if (!info.size) miss.push('근로자 수');
    if (!info.role) miss.push('응답자 역할'); if (!info.name.trim()) miss.push('성명');
    if (miss.length){ err.textContent = '필수 항목을 입력해 주세요: ' + miss.join(', '); return; }
    if (!isEmail(info.email)){ err.textContent = '이메일 주소를 정확히 입력해 주세요.'; $('#email').focus(); return; }
    const pd = info.phone.replace(/[^0-9]/g,'');
    if (pd && (pd.length < 9 || pd.length > 11)){ err.textContent = '휴대폰 번호를 확인해 주세요. (선택 항목이므로 비워 두셔도 됩니다)'; return; }
    if (!info.consent){ err.textContent = '개인정보 수집·이용에 동의해 주세요.'; return; }
  } else if (!checkArea(step-1)) return;
  step++; renderStep(); scrollTo(0,0);
}
function checkArea(a){
  const miss = [];
  DATA.questions.forEach((q,qi) => { if (q.area === a && !answers[qi]) miss.push(qi); });
  miss.forEach(qi => $('#q'+qi).classList.add('missing'));
  if (miss.length){
    $('#err').textContent = '응답하지 않은 문항이 있습니다: ' + miss.map(qi => DATA.questions[qi].no).join(', ');
    $('#q'+miss[0]).scrollIntoView({behavior:'smooth',block:'center'});
    return false;
  }
  return true;
}

/* ===== 판정 로직 (서버와 동일) ===== */
function compute(scores, jobs){
  const jobSet = new Set((jobs || []).map(d => DATA.deptMap[d]).filter(Boolean));
  const areaScores = DATA.areas.map((_,a) => DATA.questions.reduce((s,q,i) => s + (q.area === a ? scores[i] : 0), 0));
  const total = areaScores.reduce((s,v) => s+v, 0);
  const level = total>=126?5:total>=102?4:total>=78?3:total>=54?2:1;
  const areaLevels = areaScores.map(s => s>=21?5:s>=17?4:s>=13?3:s>=9?2:1);
  const rec = [], pre = []; let nextCount = 0;
  DATA.tasks.forEach((t, i) => {
    if (jobSet.size && !jobSet.has(t.job)) return;
    if (t.k > level){ nextCount++; return; }
    const thr = t.k === 1 ? 0 : t.k === 2 ? 9 : 13;
    const key = (level - t.k) * 1000 + i;
    (areaScores[t.area] < thr ? pre : rec).push({key, i});
  });
  const pick = (arr, n) => arr.sort((a,b) => a.key-b.key).slice(0,n).map(x => x.i);
  return {total, level, areaScores, areaLevels, rec: pick(rec, 8), pre: pick(pre, 4), nextCount};
}

function submit(){
  if (!checkArea(DATA.areas.length - 1)) return;
  if (answers.some(v => !v)){ $('#err').textContent = '응답하지 않은 문항이 있습니다. 이전 단계를 확인해 주세요.'; return; }
  const btn = $('#nextBtn'); btn.disabled = true; btn.textContent = ''; btn.append(h('span',{class:'spinner'}),'저장 중…');
  const payload = {type:'readiness', company:info.company, industry:info.industry, size:info.size, role:info.role, jobs:info.jobs.slice(),
    name:info.name, email:info.email.trim(), phone:info.phone, consent:info.consent, emailMe:info.emailMe,
    scores:answers.slice(), optional:optAnswers.slice()};
  const local = compute(payload.scores, payload.jobs);
  const fail = e => {
    btn.disabled = false; btn.textContent = '제출하고 결과 보기';
    $('#err').textContent = '저장 중 문제가 발생했습니다. 잠시 후 다시 눌러 주세요. (' + ((e && e.message) || e) + ')';
  };
  if (!DEPLOY_ID || DEPLOY_ID.indexOf('__') === 0){ setTimeout(() => showResult(Object.assign(local,{mail:'none'})), 300); return; }
  fetch(API_URL, {method:'POST', body: JSON.stringify(payload), redirect:'follow'})
    .then(res => res.json())
    .then(j => j && j.ok ? showResult(Object.assign(local, {mail: j.result.mail})) : fail(new Error((j && j.error) || '서버 응답 오류')))
    .catch(fail);
}

function radarSVG(scores){
  const N = scores.length, cx=210, cy=180, R=120, ns='http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox','-60 0 540 360'); svg.setAttribute('role','img');
  svg.setAttribute('aria-label','영역별 점수: '+DATA.areas.map((a,i)=>`${a} ${scores[i]}점`).join(', '));
  const pt = (i,r) => { const g = -Math.PI/2 + i*2*Math.PI/N; return [cx + r*Math.cos(g), cy + r*Math.sin(g)]; };
  const mk = (tag, at) => { const e = document.createElementNS(ns,tag); for (const k in at) e.setAttribute(k,at[k]); svg.append(e); return e; };
  [5,10,15,20,25].forEach(v => mk('polygon',{points:[...Array(N)].map((_,i)=>pt(i,R*v/25).join(',')).join(' '),fill:v===25?'#F7F9FC':'none',stroke:'#D5DCE6','stroke-width':1}));
  for (let i=0;i<N;i++){ const [x,y]=pt(i,R); mk('line',{x1:cx,y1:cy,x2:x,y2:y,stroke:'#D5DCE6'}); }
  mk('polygon',{points:scores.map((s,i)=>pt(i,R*s/25).join(',')).join(' '),fill:'rgba(21,101,192,.22)',stroke:'#1565C0','stroke-width':2.5,'stroke-linejoin':'round'});
  scores.forEach((s,i) => {
    const [x,y] = pt(i,R*s/25); mk('circle',{cx:x,cy:y,r:4,fill:'#1565C0'});
    const [lx,ly] = pt(i,R+34);
    const anchor = Math.abs(lx-cx) < 10 ? 'middle' : (lx > cx ? 'start' : 'end');
    const dx = anchor === 'start' ? -8 : anchor === 'end' ? 8 : 0;
    mk('text',{x:lx+dx,y:ly-2,'text-anchor':anchor,'font-size':13,'font-weight':700,fill:'#1B2430'}).textContent = DATA.areas[i];
    mk('text',{x:lx+dx,y:ly+15,'text-anchor':anchor,'font-size':12.5,'font-weight':700,fill:'#1565C0'}).textContent = s+'점';
  });
  return svg;
}

  scrollTo(0,0);
}

window.onbeforeunload = () => answers.some(Boolean) ? true : undefined;
renderStep(); updateProgress();
</script>
